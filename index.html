<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/branding/circuit-practice-d2.ico" />
    <link rel="apple-touch-icon" href="/branding/circuit-practice-d2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F3F7FC" />
    <meta name="description" content="Laboratorio interactivo para simplificar circuitos eléctricos." />
    <title>Circuitos en equilibrio · Laboratorio</title>
    <style>
      html,
      body {
        min-height: 100%;
        background-color: #F3F7FC;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background-color: #0B1422;
      }
    </style>
    <script>
      try {
        const savedSession = JSON.parse(localStorage.getItem('circuit-practice:session:v2') || 'null');
        const theme = savedSession?.settings?.theme === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch {
        document.documentElement.dataset.theme = 'light';
        document.documentElement.style.colorScheme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
